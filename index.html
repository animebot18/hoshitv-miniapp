<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Katalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🎬 HoshiTV</h1>
            <div class="header-actions">
                <button class="icon-btn" id="searchBtn">🔍</button>
                <button class="icon-btn" id="profileBtn">👤</button>
            </div>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container" id="searchContainer" style="display: none;">
            <input type="text" id="searchInput" placeholder="Anime qidirish..." class="search-input">
            <button class="close-btn" id="closeSearch">✕</button>
        </div>
        
        <!-- Filter Buttons -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Barchasi</button>
            <button class="filter-tab" data-filter="new">Yangi</button>
            <button class="filter-tab" data-filter="popular">Ommabop</button>
            <button class="filter-tab" data-filter="premium">Premium</button>
        </div>
        
        <!-- Genre Filter -->
        <div class="genre-filter">
            <select id="genreSelect" class="genre-select">
                <option value="">Barcha janrlar</option>
                <option value="action">Action</option>
                <option value="adventure">Adventure</option>
                <option value="comedy">Comedy</option>
                <option value="drama">Drama</option>
                <option value="fantasy">Fantasy</option>
                <option value="horror">Horror</option>
                <option value="mystery">Mystery</option>
                <option value="romance">Romance</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="sports">Sports</option>
            </select>
            
            <select id="yearSelect" class="year-select">
                <option value="">Barcha yillar</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="older">2020 dan oldin</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Yuklanmoqda...</p>
        </div>
        
        <!-- Anime Grid -->
        <div class="anime-grid" id="animeGrid">
            <!-- Anime cards will be inserted here -->
        </div>
        
        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📭</div>
            <h3>Anime topilmadi</h3>
            <p>Filterlarni o'zgartiring yoki boshqa qidiring</p>
        </div>
    </main>

    <!-- Anime Detail Modal -->
    <div class="modal" id="animeModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">✕</button>
            
            <div class="modal-header">
                <img id="modalPoster" class="modal-poster" src="" alt="">
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalGenre" class="meta-tag"></span>
                        <span id="modalYear" class="meta-tag"></span>
                    </div>
                    <div class="modal-stats">
                        <span>👁 <span id="modalViews">0</span></span>
                        <span id="modalPremium" style="display: none;">💎 Premium</span>
                    </div>
                    <p id="modalVoice" class="voice-info"></p>
                </div>
            </div>
            
            <!-- Episodes List -->
            <div class="episodes-section">
                <h3>📺 Qismlar</h3>
                <div class="episodes-grid" id="episodesGrid">
                    <!-- Episodes will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content profile-content">
            <button class="modal-close" id="closeProfile">✕</button>
            
            <div class="profile-header">
                <div class="profile-avatar">👤</div>
                <h2 id="profileName">Foydalanuvchi</h2>
                <p id="profileUsername" class="profile-username">@username</p>
            </div>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value" id="favoriteCount">0</div>
                    <div class="stat-label">Sevimlilar</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="watchedCount">0</div>
                    <div class="stat-label">Ko'rilgan</div>
                </div>
            </div>
            
            <div class="premium-section" id="premiumSection">
                <div class="premium-status" id="premiumStatus">
                    <div class="premium-icon">💎</div>
                    <div class="premium-info">
                        <h3 id="premiumTitle">Premium obuna</h3>
                        <p id="premiumText">Premium obunangiz yo'q</p>
                    </div>
                </div>
                <button class="premium-btn" id="premiumBtn">Premium sotib olish</button>
            </div>
            
            <div class="profile-actions">
                <button class="profile-action-btn" id="favoritesBtn">
                    ❤️ Sevimlilarim
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
