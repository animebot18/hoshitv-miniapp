<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HoshiTV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #8b5cf6;
    --accent2: #a78bfa;
    --accent3: #6d28d9;
    --pink: #ec4899;
    --cyan: #06b6d4;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --gold: #f59e0b;
    --success: #10b981;
    --danger: #ef4444;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(139,92,246,0.15);
    --glow: 0 0 20px rgba(139,92,246,0.3);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .logo-icon { font-size: 24px; -webkit-text-fill-color: initial; }
  .user-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: var(--text2);
  }
  .premium-badge {
    background: linear-gradient(135deg, var(--gold), #f97316);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 700;
  }

  /* SEARCH */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px;
  }
  .search-box input::placeholder { color: var(--text3); }
  .search-icon { color: var(--text3); font-size: 16px; }

  /* NAV */
  .nav {
    display: flex; gap: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
    padding: 0 4px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 16px; background: none; border: none;
    color: var(--text3); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .nav-btn.active {
    color: var(--accent); border-bottom-color: var(--accent);
  }

  /* PAGES */
  .page { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }

  /* FILTERS */
  .filters {
    display: flex; gap: 8px; margin-bottom: 16px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 4px;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 6px 14px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; font-size: 12px; color: var(--text2);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .filter-chip.active {
    background: var(--accent); border-color: var(--accent);
    color: white; font-weight: 600;
  }

  /* SECTION TITLE */
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; margin-bottom: 14px;
  }
  .section-title span { color: var(--accent); }

  /* ANIME GRID */
  .anime-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .anime-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; transition: all 0.25s; position: relative;
  }
  .anime-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-2px); }
  .anime-card:active { transform: scale(0.97); }
  
  .card-poster {
    width: 100%; aspect-ratio: 3/4; object-fit: cover;
    background: var(--bg3);
  }
  .card-poster-placeholder {
    width: 100%; aspect-ratio: 3/4;
    background: linear-gradient(135deg, var(--bg3), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
  }
  .card-body { padding: 10px; }
  .card-title {
    font-size: 13px; font-weight: 700; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--text3);
  }
  .card-badge {
    position: absolute; top: 8px; left: 8px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    color: white; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
  }
  .premium-lock {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.7); border-radius: 50%;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* ANIME DETAIL */
  .detail-poster {
    width: 100%; height: 220px; object-fit: cover;
    border-radius: var(--radius); margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .detail-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .fav-btn {
    background: none; border: 2px solid var(--border);
    border-radius: 50%; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .fav-btn.active { border-color: var(--pink); background: rgba(236,72,153,0.15); }
  
  .info-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .info-tag {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--text2);
  }
  .info-tag span { color: var(--accent); }
  
  .desc-text {
    font-size: 13px; color: var(--text2); line-height: 1.6;
    margin: 12px 0; padding: 12px; background: var(--bg3);
    border-radius: var(--radius-sm); border-left: 3px solid var(--accent);
  }

  /* EPISODES LIST */
  .episodes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ep-btn {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 6px;
    text-align: center; cursor: pointer; transition: all 0.2s;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .ep-btn:hover { border-color: var(--accent); background: rgba(139,92,246,0.1); }
  .ep-btn:active { transform: scale(0.95); }
  .ep-num { font-size: 16px; font-weight: 800; color: var(--accent); }
  .ep-label { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* PROFILE */
  .profile-card {
    background: linear-gradient(135deg, var(--accent3), var(--bg3));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; text-align: center;
  }
  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 12px;
    border: 3px solid rgba(255,255,255,0.2);
  }
  .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .premium-card {
    background: linear-gradient(135deg, #7c3aed, #db2777);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .premium-card-icon { font-size: 36px; }
  .premium-card-info { flex: 1; }
  .premium-card-title { font-size: 16px; font-weight: 800; }
  .premium-card-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  /* PRICING */
  .pricing-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .pricing-card {
    background: var(--bg3); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 14px; text-align: center;
    cursor: pointer; transition: all 0.2s; position: relative;
  }
  .pricing-card:hover { border-color: var(--accent); }
  .pricing-card.popular {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(245,158,11,0.1), var(--bg3));
  }
  .pricing-label {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #000; font-size: 10px; font-weight: 800;
    padding: 2px 10px; border-radius: 10px; white-space: nowrap;
  }
  .pricing-duration { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .pricing-price {
    font-size: 20px; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .pricing-unit { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .buy-btn {
    display: block; width: 100%; margin-top: 10px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    color: white; border: none; border-radius: 10px;
    padding: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .buy-btn:active { opacity: 0.8; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; border: none; width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    color: white; box-shadow: var(--shadow);
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-outline {
    background: none; border: 2px solid var(--border);
    color: var(--text2);
  }
  .btn-outline:active { border-color: var(--accent); color: var(--accent); }
  .btn-back {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); padding: 8px 14px; border-radius: 10px;
    cursor: pointer; font-size: 13px; margin-bottom: 14px;
    transition: all 0.2s;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 48px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 64px; margin-bottom: 12px; }
  .empty-title { font-size: 18px; font-weight: 700; color: var(--text2); margin-bottom: 6px; }

  /* LOADING */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 48px; flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 20px; font-size: 13px;
    z-index: 1000; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(18,18,26,0.95); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; padding: 6px 0 env(safe-area-inset-bottom);
    z-index: 100;
  }
  .bottom-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px; cursor: pointer; transition: all 0.2s;
    background: none; border: none; color: var(--text3); font-size: 10px;
  }
  .bottom-btn.active { color: var(--accent); }
  .bottom-btn-icon { font-size: 20px; margin-bottom: 1px; }
  .bottom-btn.active .bottom-btn-icon { transform: scale(1.1); }

  /* PREMIUM LOCK OVERLAY */
  .lock-overlay {
    background: linear-gradient(135deg, rgba(109,40,217,0.15), rgba(236,72,153,0.1));
    border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 24px; text-align: center; margin: 12px 0;
  }
  .lock-icon { font-size: 48px; margin-bottom: 10px; }
  .lock-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
  .lock-sub { font-size: 13px; color: var(--text2); margin-bottom: 16px; }

  /* SCROLLABLE CONTENT */
  .content { padding-bottom: 80px; }
  
  /* STAT CHIPS */
  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat-chip {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--text2);
  }
  .stat-chip b { color: var(--text); }

  /* HORIZONTAL SCROLL LIST */
  .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-card {
    flex: 0 0 120px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; cursor: pointer;
    transition: all 0.2s;
  }
  .h-card:active { transform: scale(0.95); }
  .h-card-img { width: 100%; height: 160px; object-fit: cover; background: var(--bg3); }
  .h-card-img-placeholder {
    width: 100%; height: 160px;
    background: linear-gradient(135deg, var(--bg3), var(--bg2));
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .h-card-name { padding: 6px 8px; font-size: 11px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo"><span class="logo-icon">🌸</span> AniStream</div>
    <div class="user-badge" id="userBadge">
      <span>⏳</span> <span id="userStatus">Yuklanmoqda...</span>
    </div>
  </div>
  <div class="search-box" id="searchBox" style="display:none">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Anime qidiring..." id="searchInput" oninput="handleSearch()">
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="bottom-btn active" onclick="showPage('home')" id="nav-home">
    <div class="bottom-btn-icon">🏠</div>
    <span>Bosh sahifa</span>
  </button>
  <button class="bottom-btn" onclick="showPage('catalog')" id="nav-catalog">
    <div class="bottom-btn-icon">🎬</div>
    <span>Animelar</span>
  </button>
  <button class="bottom-btn" onclick="showPage('favorites')" id="nav-favorites">
    <div class="bottom-btn-icon">❤️</div>
    <span>Sevimlilar</span>
  </button>
  <button class="bottom-btn" onclick="showPage('profile')" id="nav-profile">
    <div class="bottom-btn-icon">👤</div>
    <span>Profil</span>
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CONTENT -->
<div class="content">

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="section-title">🔥 Yangi Qo'shilganlar</div>
  <div class="h-scroll" id="newAnimes">
    <div class="loading"><div class="spinner"></div></div>
  </div>
  
  <div class="section-title" style="margin-top:20px">⭐ Mashhur Animelar</div>
  <div class="anime-grid" id="popularGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
  
  <div class="section-title">🎭 Janrlar bo'yicha</div>
  <div class="filters" id="homeGenres"></div>
</div>

<!-- CATALOG PAGE -->
<div class="page" id="page-catalog">
  <div class="filters" id="genreFilters">
    <div class="filter-chip active" onclick="filterGenre(null, this)">Barchasi</div>
  </div>
  <div style="margin-bottom:10px">
    <select id="yearFilter" onchange="filterYear()" style="
      background:var(--bg3); border:1px solid var(--border); color:var(--text2);
      border-radius:8px; padding:6px 10px; font-size:12px; width:auto;
    ">
      <option value="">Barcha yillar</option>
    </select>
    <label style="margin-left:10px; font-size:12px; color:var(--text2);">
      <input type="checkbox" id="premiumOnly" onchange="filterPremium()"> 👑 Premium
    </label>
  </div>
  <div class="anime-grid" id="catalogGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</div>

<!-- FAVORITES PAGE -->
<div class="page" id="page-favorites">
  <div class="section-title">❤️ <span>Sevimlilar</span></div>
  <div class="anime-grid" id="favGrid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</div>

<!-- PROFILE PAGE -->
<div class="page" id="page-profile">
  <div id="profileContent">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- ANIME DETAIL PAGE -->
<div class="page" id="page-detail">
  <button class="btn-back" onclick="goBack()">← Orqaga</button>
  <div id="detailContent">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

</div><!-- /content -->

<script>
// ===== CONFIGURATION =====
const API_URL = 'YOUR_API_URL_HERE'; // Railway API URL
const tg = window.Telegram.WebApp;

let currentUser = null;
let allAnimes = [];
let filteredAnimes = [];
let currentAnimeId = null;
let favorites = new Set();
let previousPage = 'home';
let currentGenre = null;
let currentYear = null;
let currentPremOnly = false;

// ===== INIT =====
async function init() {
  tg.expand();
  tg.enableClosingConfirmation();
  
  const userInfo = tg.initDataUnsafe?.user;
  if (userInfo) {
    currentUser = userInfo;
    await loadUserData();
  }
  
  await Promise.all([loadAllAnimes(), loadFavorites(), loadGenres(), loadYears()]);
  renderHomePage();
  renderCatalog();
}

async function loadUserData() {
  try {
    const res = await fetch(`${API_URL}/user/${currentUser.id}`);
    const data = await res.json();
    currentUser = { ...currentUser, ...data };
    
    const badge = document.getElementById('userBadge');
    const status = document.getElementById('userStatus');
    if (currentUser.is_premium) {
      badge.innerHTML = '<span>👑</span> <span class="premium-badge">Premium</span>';
    } else {
      status.textContent = currentUser.first_name || 'Foydalanuvchi';
    }
  } catch(e) {
    document.getElementById('userStatus').textContent = currentUser?.first_name || 'Foydalanuvchi';
  }
}

async function loadAllAnimes() {
  try {
    const res = await fetch(`${API_URL}/animes`);
    allAnimes = await res.json();
    filteredAnimes = [...allAnimes];
  } catch(e) {
    console.error('Animelar yuklanmadi:', e);
  }
}

async function loadFavorites() {
  if (!currentUser) return;
  try {
    const res = await fetch(`${API_URL}/user/${currentUser.id}/favorites`);
    const data = await res.json();
    favorites = new Set(data.map(a => a.id));
  } catch(e) {}
}

async function loadGenres() {
  try {
    const res = await fetch(`${API_URL}/genres`);
    const genres = await res.json();
    
    const catalogFilters = document.getElementById('genreFilters');
    const homeGenres = document.getElementById('homeGenres');
    
    genres.forEach(g => {
      const chip1 = document.createElement('div');
      chip1.className = 'filter-chip';
      chip1.textContent = g;
      chip1.onclick = () => filterGenre(g, chip1);
      catalogFilters.appendChild(chip1);
      
      const chip2 = document.createElement('div');
      chip2.className = 'filter-chip';
      chip2.textContent = g;
      chip2.onclick = () => { showPage('catalog'); filterGenre(g, null); };
      homeGenres.appendChild(chip2);
    });
  } catch(e) {}
}

async function loadYears() {
  try {
    const res = await fetch(`${API_URL}/years`);
    const years = await res.json();
    const sel = document.getElementById('yearFilter');
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

// ===== RENDERING =====
function renderHomePage() {
  // New animes (horizontal scroll)
  const newAnimes = document.getElementById('newAnimes');
  const recent = allAnimes.slice(0, 8);
  if (!recent.length) { newAnimes.innerHTML = '<div class="empty-state" style="min-width:200px">😔 Hali anime yo\'q</div>'; return; }
  
  newAnimes.innerHTML = recent.map(a => `
    <div class="h-card" onclick="openAnime(${a.id})">
      ${a.poster_file_id ? 
        `<div class="h-card-img-placeholder">🎬</div>` : 
        `<div class="h-card-img-placeholder">🎬</div>`}
      <div class="h-card-name">${a.name}</div>
    </div>
  `).join('');
  
  // Popular grid (first 6)
  const popularGrid = document.getElementById('popularGrid');
  renderAnimeGrid(allAnimes.slice(0, 6), popularGrid);
}

function renderAnimeGrid(animes, container) {
  if (!animes.length) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">😔</div>
        <div class="empty-title">Hech narsa topilmadi</div>
        <p>Boshqa kalit so'z sinab ko'ring</p>
      </div>`;
    return;
  }
  
  container.innerHTML = animes.map(a => `
    <div class="anime-card" onclick="openAnime(${a.id})">
      ${a.is_premium ? '<div class="card-badge">👑 Premium</div>' : ''}
      ${a.is_premium && !currentUser?.is_premium ? '<div class="premium-lock">🔒</div>' : ''}
      <div class="card-poster-placeholder">🎬</div>
      <div class="card-body">
        <div class="card-title">${a.name}</div>
        <div class="card-meta">
          <span>${a.genre || 'Janrsiz'}</span>
          <span>📺 ${a.episode_count || 0}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function renderCatalog() {
  const grid = document.getElementById('catalogGrid');
  renderAnimeGrid(filteredAnimes, grid);
}

// ===== FILTERS =====
function filterGenre(genre, chip) {
  currentGenre = genre;
  
  document.querySelectorAll('#genreFilters .filter-chip').forEach(c => c.classList.remove('active'));
  if (chip) chip.classList.add('active');
  else document.querySelector('#genreFilters .filter-chip').classList.add('active');
  
  applyFilters();
}

function filterYear() {
  currentYear = document.getElementById('yearFilter').value || null;
  applyFilters();
}

function filterPremium() {
  currentPremOnly = document.getElementById('premiumOnly').checked;
  applyFilters();
}

function applyFilters() {
  filteredAnimes = allAnimes.filter(a => {
    if (currentGenre && a.genre !== currentGenre) return false;
    if (currentYear && String(a.year) !== String(currentYear)) return false;
    if (currentPremOnly && !a.is_premium) return false;
    return true;
  });
  renderCatalog();
}

function handleSearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { filteredAnimes = [...allAnimes]; renderCatalog(); return; }
  filteredAnimes = allAnimes.filter(a => 
    a.name.toLowerCase().includes(q) || 
    (a.genre && a.genre.toLowerCase().includes(q)) ||
    (a.dubber && a.dubber.toLowerCase().includes(q))
  );
  renderCatalog();
}

// ===== ANIME DETAIL =====
async function openAnime(animeId) {
  currentAnimeId = animeId;
  previousPage = document.querySelector('.page.active')?.id?.replace('page-','') || 'home';
  showPage('detail');
  
  const detail = document.getElementById('detailContent');
  detail.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  
  try {
    const res = await fetch(`${API_URL}/animes/${animeId}`);
    const anime = await res.json();
    
    const isFav = favorites.has(animeId);
    const isPremUser = currentUser?.is_premium;
    const isLocked = anime.is_premium && !isPremUser;
    
    detail.innerHTML = `
      <div class="card-poster-placeholder" style="height:200px;border-radius:var(--radius);margin-bottom:14px;font-size:64px">🎬</div>
      
      <div class="detail-header">
        <div>
          <div class="detail-title">${anime.name}</div>
          ${anime.is_premium ? '<span style="font-size:12px;color:var(--gold)">👑 Premium Anime</span>' : '<span style="font-size:12px;color:var(--success)">🆓 Bepul</span>'}
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${animeId})" id="favBtn-${animeId}">
          ${isFav ? '❤️' : '🤍'}
        </button>
      </div>
      
      <div class="info-tags">
        ${anime.genre ? `<div class="info-tag">🎭 <span>${anime.genre}</span></div>` : ''}
        ${anime.year ? `<div class="info-tag">📅 <span>${anime.year}</span></div>` : ''}
        ${anime.dubber ? `<div class="info-tag">🎙 <span>${anime.dubber}</span></div>` : ''}
      </div>
      
      ${anime.description ? `<div class="desc-text">📝 ${anime.description}</div>` : ''}
      
      ${isLocked ? `
        <div class="lock-overlay">
          <div class="lock-icon">🔒</div>
          <div class="lock-title">Premium Kontent</div>
          <div class="lock-sub">Bu animeni ko'rish uchun Premium obuna kerak</div>
          <button class="btn btn-primary" onclick="showPage('profile')">
            👑 Premium Olish
          </button>
        </div>
      ` : `
        <div class="section-title" style="margin-top:16px">📺 Qismlar</div>
        <div id="episodes-${animeId}">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      `}
    `;
    
    if (!isLocked) {
      loadEpisodes(animeId);
    }
    
  } catch(e) {
    detail.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">Yuklashda xatolik</div></div>';
  }
}

async function loadEpisodes(animeId) {
  const container = document.getElementById(`episodes-${animeId}`);
  try {
    const res = await fetch(`${API_URL}/animes/${animeId}/episodes?user_id=${currentUser?.id || ''}`);
    const episodes = await res.json();
    
    if (!episodes.length) {
      container.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-icon">📭</div><p>Hali qismlar yo\'q</p></div>';
      return;
    }
    
    container.innerHTML = `<div class="episodes-grid">${episodes.map(ep => `
      <div class="ep-btn" onclick="playEpisode(${ep.id})">
        <div class="ep-num">${ep.episode_number}</div>
        <div class="ep-label">qism</div>
        ${ep.title ? `<div style="font-size:9px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ep.title}</div>` : ''}
      </div>
    `).join('')}</div>`;
    
  } catch(e) {
    if (e.message?.includes('403')) {
      container.innerHTML = `<div class="lock-overlay">
        <div class="lock-title">🔒 Premium Kerak</div>
        <button class="btn btn-primary" onclick="showPage('profile')">Premium Olish</button>
      </div>`;
    }
  }
}

async function playEpisode(episodeId) {
  try {
    showToast('⏳ Video yuborilmoqda...');
    const res = await fetch(`${API_URL}/play/${episodeId}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: currentUser?.id, episode_id: episodeId })
    });
    
    if (res.ok) {
      showToast('✅ Video botdan yuborildi! Bot oynasini oching 📱');
      setTimeout(() => tg.close(), 2000);
    } else if (res.status === 403) {
      showToast('🔒 Premium kerak!');
    }
  } catch(e) {
    showToast('❌ Xatolik yuz berdi');
  }
}

// ===== FAVORITES =====
async function toggleFav(animeId) {
  if (!currentUser) return;
  
  try {
    const res = await fetch(`${API_URL}/favorites`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: currentUser.id, anime_id: animeId })
    });
    const data = await res.json();
    
    const btn = document.getElementById(`favBtn-${animeId}`);
    if (data.action === 'added') {
      favorites.add(animeId);
      btn.textContent = '❤️'; btn.classList.add('active');
      showToast('❤️ Sevimlilarga qo\'shildi!');
    } else {
      favorites.delete(animeId);
      btn.textContent = '🤍'; btn.classList.remove('active');
      showToast('💔 Sevimlilardan o\'chirildi');
    }
  } catch(e) {}
}

function renderFavorites() {
  const grid = document.getElementById('favGrid');
  const favAnimes = allAnimes.filter(a => favorites.has(a.id));
  if (!favAnimes.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">💔</div>
      <div class="empty-title">Sevimlilar bo'sh</div>
      <p>Anime sahifasida ❤️ ni bosing</p>
    </div>`;
  } else {
    renderAnimeGrid(favAnimes, grid);
  }
}

// ===== PROFILE =====
function renderProfile() {
  const container = document.getElementById('profileContent');
  const user = currentUser;
  const isPrem = user?.is_premium;
  
  let premUntil = '';
  if (user?.premium_until) {
    const d = new Date(user.premium_until);
    const days = Math.ceil((d - Date.now()) / 86400000);
    if (days > 0) premUntil = `${days} kun qoldi (${d.toLocaleDateString('uz-UZ')})`;
  }
  
  container.innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar">${user?.first_name?.[0] || '👤'}</div>
      <div class="profile-name">${user?.first_name || 'Foydalanuvchi'}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.7)">@${user?.username || 'username_yoq'}</div>
    </div>
    
    ${isPrem ? `
      <div class="premium-card">
        <div class="premium-card-icon">👑</div>
        <div class="premium-card-info">
          <div class="premium-card-title">Premium Faol</div>
          <div class="premium-card-sub">${premUntil}</div>
        </div>
      </div>
    ` : `
      <div style="background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;text-align:center">
        <div style="font-size:14px;font-weight:700;margin-bottom:4px">🆓 Oddiy Foydalanuvchi</div>
        <div style="font-size:12px;color:var(--text2)">Premium animelar uchun obuna oling</div>
      </div>
    `}
    
    <div class="section-title" style="margin:16px 0 12px">💰 Premium Narxlar</div>
    <div class="pricing-grid">
      <div class="pricing-card" onclick="buyPremium(30)">
        <div class="pricing-duration">1 Oy</div>
        <div class="pricing-price">29,000</div>
        <div class="pricing-unit">so'm</div>
        <button class="buy-btn">Sotib olish</button>
      </div>
      <div class="pricing-card popular" onclick="buyPremium(90)">
        <div class="pricing-label">🔥 Mashhur</div>
        <div class="pricing-duration">3 Oy</div>
        <div class="pricing-price">69,000</div>
        <div class="pricing-unit">so'm</div>
        <button class="buy-btn">Sotib olish</button>
      </div>
      <div class="pricing-card" onclick="buyPremium(180)">
        <div class="pricing-duration">6 Oy</div>
        <div class="pricing-price">99,000</div>
        <div class="pricing-unit">so'm</div>
        <button class="buy-btn">Sotib olish</button>
      </div>
      <div class="pricing-card" onclick="buyPremium(365)">
        <div class="pricing-duration">1 Yil</div>
        <div class="pricing-price">199,000</div>
        <div class="pricing-unit">so'm</div>
        <button class="buy-btn">Sotib olish</button>
      </div>
    </div>
    
    <div style="margin-top:20px">
      <div class="section-title">🎬 Barcha Animelar</div>
      <button class="btn btn-outline" onclick="showPage('catalog')">
        📋 Animelarga o'tish
      </button>
    </div>
  `;
}

function buyPremium(days) {
  const prices = {30: 29000, 90: 69000, 180: 99000, 365: 199000};
  const price = prices[days];
  showToast(`💳 To'lov qilish uchun botga boring!`);
  tg.sendData(JSON.stringify({action: 'buy_premium', days, price}));
  setTimeout(() => tg.close(), 1000);
}

// ===== NAVIGATION =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active'));
  
  const page = document.getElementById(`page-${name}`);
  if (page) page.classList.add('active');
  
  const navBtn = document.getElementById(`nav-${name}`);
  if (navBtn) navBtn.classList.add('active');
  
  const searchBox = document.getElementById('searchBox');
  searchBox.style.display = name === 'catalog' ? 'flex' : 'none';
  
  if (name === 'favorites') renderFavorites();
  if (name === 'profile') renderProfile();
}

function goBack() {
  showPage(previousPage);
}

// ===== UTILS =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== START =====
init();
</script>
</body>
</html>
